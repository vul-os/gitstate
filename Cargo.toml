[workspace]
resolver = "2"
members = ["crates/*"]
# gitstate-sync used to be `exclude`d here, for a reason that no longer exists.
# It carried an optional GIT dependency on `dmtap-sync` inside the envoir repo —
# a product importing a product to get a merge engine — and Cargo resolves every
# optional dependency's source during workspace resolution regardless of which
# features are active, so a plain `cargo build` still shelled out to the envoir
# git remote with the feature off. `default-members` does not prevent that; only
# `exclude` did.
#
# The shared engine has since been extracted into the KOTVA substrate and
# published to crates.io as `kotva-sync`. A registry dependency resolves from the
# committed Cargo.lock with no network access at all, so the exclusion bought
# nothing and cost the default gate: `cargo test --workspace` never compiled or
# ran gitstate-sync's tests. It is now an ordinary member.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vul-os/gitstate"
rust-version = "1.85"

[workspace.dependencies]
gitstate-calibrate = { path = "crates/gitstate-calibrate" }
gitstate-core = { path = "crates/gitstate-core" }
gitstate-git = { path = "crates/gitstate-git" }
gitstate-forge = { path = "crates/gitstate-forge" }
gitstate-classify = { path = "crates/gitstate-classify" }
gitstate-search = { path = "crates/gitstate-search" }
gitstate-store = { path = "crates/gitstate-store" }
gitstate-tracker = { path = "crates/gitstate-tracker" }
gitstate-daemon = { path = "crates/gitstate-daemon" }
gitstate-cli = { path = "crates/gitstate-cli" }
gitstate-sync = { path = "crates/gitstate-sync" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
# `rand_core`: a node mints its own sync identity keypair on the node itself
# (`SigningKey::generate`). Nothing is provisioned, escrowed or defaulted.
ed25519-dalek = { version = "2", features = ["rand_core"] }
git2 = { version = "0.19", default-features = false }
hex = "0.4"
# The shared merge engine (KOTVA substrate capability ③, `substrate/SYNC.md`),
# published to crates.io. gitstate uses it as the reference its own algebra is
# held against — see crates/gitstate-sync/tests/shared_engine_parity.rs.
#
# DEPENDENCY-RENAME, following the substrate's own documented convention (and the
# sibling products'): the package is `kotva-sync`, the Rust path consumers write
# is `dmtap_sync::`. The protocol is still DMTAP; only the crate moved, out of the
# envoir product and into the substrate repo, which is why gitstate no longer
# carries a git dependency on another product to get a merge engine.
dmtap-sync = { package = "kotva-sync", version = "0.1.0" }
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "blocking",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
uninlined_format_args = "allow"
