<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gitstate docs — local-first project state from your own git</title>
<meta name="description" content="Documentation for gitstate: getting started, the derivation model, classification and the signed taxonomy, contexts and P2P sync, the CLI, the HTTP API, configuration and the threat model.">
<meta name="theme-color" content="#0B1120">

<style>
/* Self-hosted faces — the same three the desktop app ships with. */
@font-face{font-family:'Bricolage Grotesque';src:url('./assets/fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2-variations');font-weight:200 800;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('./assets/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2-variations');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('./assets/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('./assets/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2');font-weight:500;font-display:swap}

:root{
  --bg:#0B1120; --surface:#101827; --surface2:#172032; --surface3:#1d2b41;
  --border:#1c2a40; --border2:#22334e;
  --text:#e2e8f0; --dim:#cbd5e1; --muted:#94a3b8; --faint:#8593a8;
  --teal:#2DD4BF; --indigo:#6366F1; --ok:#34D399; --warn:#FBBF24; --bad:#F87171;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --grad:linear-gradient(120deg,var(--teal),var(--indigo));
  --max:1320px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.68;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(760px 420px at 88% -6%, rgba(99,102,241,.10), transparent 62%),
             radial-gradient(700px 400px at 2% 2%, rgba(45,212,191,.07), transparent 60%)}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
::selection{background:rgba(45,212,191,.25);color:#fff}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

/* ── Header (identical grammar to the landing) ────────────────────────────── */
header.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--border)}
header.top .bar{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:500;font-size:17px}
.brand svg{width:30px;height:30px;flex:none}
.brand .tag{font-family:var(--mono);font-size:11px;color:var(--faint);border-left:1px solid var(--border2);padding-left:10px;margin-left:2px}
.spacer{flex:1}
nav.links{display:flex;gap:24px}
nav.links a{font-size:14px;color:var(--muted);transition:color .16s}
nav.links a:hover{color:var(--text)}
.ghost-link{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--border2);font-size:13px;color:var(--dim);transition:.18s}
.ghost-link:hover{border-color:color-mix(in srgb,var(--teal) 55%,var(--border2));color:var(--text);background:var(--surface)}
@media (max-width:900px){nav.links{display:none}}
@media (max-width:560px){.brand .tag{display:none}}

/* ── Shell ────────────────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr) 208px;gap:40px;align-items:start;padding:34px 0 90px}
@media (max-width:1180px){.shell{grid-template-columns:240px minmax(0,1fr);gap:32px}.toc{display:none}}
@media (max-width:900px){.shell{grid-template-columns:1fr;gap:22px;padding-top:20px}}

/* Sidebar */
.side{position:sticky;top:86px;max-height:calc(100vh - 110px);overflow:auto;padding-right:6px}
@media (max-width:900px){.side{position:static;max-height:none}}
.side .search{position:relative;margin-bottom:16px}
.side .search input{width:100%;padding:9px 12px 9px 32px;border-radius:9px;background:var(--surface);
  border:1px solid var(--border2);color:var(--text);font-family:var(--body);font-size:14px;outline:none}
.side .search input:focus{border-color:color-mix(in srgb,var(--teal) 60%,var(--border2));box-shadow:0 0 0 3px rgba(45,212,191,.12)}
.side .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.side .search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;
  color:var(--faint);border:1px solid var(--border2);border-radius:4px;padding:1px 5px;background:var(--surface2)}
.side .group{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  padding:16px 10px 7px}
.side a{display:block;padding:7px 11px;border-radius:8px;color:var(--muted);font-size:14.5px;transition:.15s}
.side a:hover{background:var(--surface);color:var(--text)}
.side a.active{background:rgba(45,212,191,.10);color:var(--teal);box-shadow:inset 2px 0 0 var(--teal)}
.side a.hidden{display:none}
.side .empty{padding:10px;color:var(--faint);font-size:13.5px}

/* Right rail — on-page contents */
.toc{position:sticky;top:86px;max-height:calc(100vh - 110px);overflow:auto}
.toc b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:10px}
.toc a{display:block;padding:5px 0 5px 12px;border-left:1px solid var(--border);color:var(--muted);font-size:13.5px;
  line-height:1.45;transition:.15s}
.toc a:hover{color:var(--text);border-color:var(--border2)}
.toc a.h3{padding-left:24px;font-size:13px}
.toc a.active{color:var(--teal);border-color:var(--teal)}

/* ── Article ──────────────────────────────────────────────────────────────── */
main{min-width:0}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.crumb span{color:var(--teal)}
.md{font-size:16.2px;color:var(--dim)}
.md>*:first-child{margin-top:0}
.md h1{font-family:var(--display);font-size:clamp(30px,4.2vw,42px);letter-spacing:-.03em;line-height:1.08;
  color:var(--text);margin:.1em 0 .55em;font-weight:600}
.md h2{font-family:var(--display);font-size:25px;letter-spacing:-.022em;color:var(--text);font-weight:600;
  margin:2.1em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.md h3{font-family:var(--display);font-size:19px;letter-spacing:-.015em;color:var(--text);font-weight:600;margin:1.7em 0 .5em}
.md h4{font-size:16px;color:var(--text);margin:1.4em 0 .4em;font-weight:600}
.md h2 .anchor,.md h3 .anchor{opacity:0;margin-left:10px;font-family:var(--mono);font-size:.7em;color:var(--teal);transition:opacity .15s}
.md h2:hover .anchor,.md h3:hover .anchor{opacity:1}
.md p,.md li{color:var(--dim)}
.md li{margin:.28em 0}
.md strong{color:var(--text);font-weight:600}
.md a{color:var(--teal);border-bottom:1px solid rgba(45,212,191,.3)}
.md a:hover{border-bottom-color:var(--teal)}
.md code{font-family:var(--mono);font-size:.86em;background:var(--surface2);border:1px solid var(--border);
  padding:1.5px 6px;border-radius:5px;color:var(--text)}
.md pre{position:relative;background:#070C16;border:1px solid var(--border2);border-radius:11px;padding:16px 18px;overflow:auto;margin:1.2em 0}
.md pre code{background:none;border:none;padding:0;font-size:13px;line-height:1.8;color:var(--dim)}
.md pre .copy{position:absolute;top:9px;right:9px;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  background:var(--surface2);border:1px solid var(--border2);border-radius:5px;padding:3px 8px;cursor:pointer;
  opacity:0;transition:opacity .15s,color .15s}
.md pre:hover .copy,.md pre .copy:focus{opacity:1}
.md pre .copy:hover{color:var(--teal);border-color:rgba(45,212,191,.4)}
.md blockquote{margin:1.3em 0;padding:14px 18px;border-left:2px solid var(--teal);background:rgba(45,212,191,.05);
  border-radius:0 10px 10px 0;color:var(--muted)}
.md blockquote p{color:var(--muted)}
.md table{border-collapse:collapse;width:100%;margin:1.3em 0;font-size:14.5px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:10px 13px;text-align:left;vertical-align:top}
.md th{background:var(--surface2);color:var(--text);font-weight:600;font-family:var(--body);white-space:nowrap}
/* API tables carry long JSON literals; let them wrap instead of clipping. */
.md td code{white-space:pre-wrap;word-break:break-word}
.md tr:nth-child(even) td{background:rgba(23,32,50,.4)}
.md img{border-radius:11px;margin:1.3em 0;border:1px solid var(--border2)}
.md hr{border:none;border-top:1px solid var(--border);margin:2.4em 0}
.md .mermaid{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin:1.4em 0;text-align:center;overflow:auto}
.md kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface2)}

/* Prev / next */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:56px;padding-top:26px;border-top:1px solid var(--border)}
@media (max-width:620px){.pager{grid-template-columns:1fr}}
.pager a{border:1px solid var(--border);border-radius:11px;background:var(--surface);padding:14px 18px;transition:.18s}
.pager a:hover{border-color:color-mix(in srgb,var(--teal) 45%,var(--border));background:var(--surface2)}
.pager a span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.pager a b{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.pager a.next{text-align:right}
.pager .void{border:1px dashed var(--border);border-radius:11px;opacity:.35}

.err{color:#fca5a5;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.24);padding:16px 18px;border-radius:11px}
.err code{font-family:var(--mono)}

footer.site{border-top:1px solid var(--border);padding:30px 0 46px}
footer.site .in{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
footer.site .in .l{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13.5px}
footer.site .in .l img{width:18px;height:18px;border-radius:4px}
footer.site nav{display:flex;gap:20px;flex-wrap:wrap}
footer.site nav a{color:var(--muted);font-size:13.5px}
footer.site nav a:hover{color:var(--text)}
</style>

<script>
/* The site is static: pages render straight from this repo's own markdown. */
const GROUPS = [
  { label: 'Start here', docs: [
    { slug: 'getting-started', title: 'Getting started' },
    { slug: 'configuration',   title: 'Configuration' },
    { slug: 'cli',             title: 'CLI reference' },
  ]},
  { label: 'How it derives', docs: [
    { slug: 'derivation',      title: 'Derivation model' },
    { slug: 'classification',  title: 'Classification & effort' },
    { slug: 'analytics',       title: 'Analytics & health' },
    { slug: 'import',          title: 'Jira & Linear import' },
  ]},
  { label: 'Sharing without a server', docs: [
    { slug: 'taxonomy',        title: 'Signed taxonomy' },
    { slug: 'contexts-sync',   title: 'Contexts & P2P sync' },
  ]},
  { label: 'Under the hood', docs: [
    { slug: 'architecture',    title: 'Architecture' },
    { slug: 'api',             title: 'HTTP API' },
    { slug: 'threat-model',    title: 'Threat model' },
  ]},
  { label: 'Reference', docs: [
    { slug: 'screenshots',     title: 'Screenshots' },
    { slug: 'faq',             title: 'FAQ' },
    { slug: 'roadmap',         title: 'Roadmap' },
    { slug: 'changelog',       title: 'Changelog' },
  ]},
]
const DOCS = GROUPS.flatMap((g) => g.docs.map((d) => ({ ...d, path: `./docs/${d.slug}.md` })))
const bySlug = Object.fromEntries(DOCS.map((d) => [d.slug, d]))
const byFile = Object.fromEntries(DOCS.map((d) => [`${d.slug}.md`, d]))

const navEl = document.getElementById('nav')
const emptyEl = document.getElementById('nav-empty')
const contentEl = document.getElementById('content')
const crumbEl = document.getElementById('crumb')
const tocEl = document.getElementById('toc')
const pagerEl = document.getElementById('pager')

navEl.innerHTML = GROUPS.map((g) => `
  <div class="group">${g.label}</div>
  ${g.docs.map((d) => `<a data-slug="${d.slug}" href="#${d.slug}">${d.title}</a>`).join('')}`).join('')

let mermaidReady = false
try {
  mermaid.initialize({
    startOnLoad: false, theme: 'base', securityLevel: 'loose',
    themeVariables: {
      fontFamily: "'JetBrains Mono', ui-monospace, monospace",
      primaryColor: 'transparent', primaryBorderColor: '#2DD4BF', primaryTextColor: '#cbd5e1',
      lineColor: '#5f8f8a', nodeBorder: '#3f8f86', edgeLabelBackground: 'transparent',
      clusterBorder: '#22334e', clusterBkg: 'rgba(45,212,191,0.03)', secondaryColor: '#172032',
      tertiaryColor: '#101827', textColor: '#cbd5e1',
    },
  })
  mermaidReady = true
} catch { /* diagrams degrade to code blocks */ }

if (window.marked?.setOptions) marked.setOptions({ gfm: true, breaks: false })

const slugify = (s) => s.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-')

function setActive(slug) {
  navEl.querySelectorAll('a').forEach((a) => a.classList.toggle('active', a.dataset.slug === slug))
}

async function renderMermaid() {
  if (!mermaidReady) return
  contentEl.querySelectorAll('code.language-mermaid').forEach((code) => {
    const div = document.createElement('div')
    div.className = 'mermaid'
    div.textContent = code.textContent
    code.closest('pre').replaceWith(div)
  })
  const nodes = contentEl.querySelectorAll('.mermaid')
  if (nodes.length) { try { await mermaid.run({ nodes }) } catch (e) { console.warn('mermaid', e) } }
}

function buildToc() {
  const heads = [...contentEl.querySelectorAll('h2, h3')]
  if (heads.length < 2) { tocEl.innerHTML = ''; return }
  tocEl.innerHTML = '<b>On this page</b>' + heads.map((h) => {
    if (!h.id) h.id = slugify(h.textContent)
    return `<a href="#${location.hash.replace('#','').split('/')[0] || 'getting-started'}" data-to="${h.id}" class="${h.tagName === 'H3' ? 'h3' : ''}">${h.textContent.replace('#','')}</a>`
  }).join('')
  tocEl.querySelectorAll('a').forEach((a) => {
    a.addEventListener('click', (e) => {
      e.preventDefault()
      document.getElementById(a.dataset.to)?.scrollIntoView({ behavior: 'smooth', block: 'start' })
    })
  })
  // Highlight the section currently on screen.
  if ('IntersectionObserver' in window) {
    const links = new Map([...tocEl.querySelectorAll('a')].map((a) => [a.dataset.to, a]))
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return
        links.forEach((l) => l.classList.remove('active'))
        links.get(en.target.id)?.classList.add('active')
      })
    }, { rootMargin: '-80px 0px -70% 0px' })
    heads.forEach((h) => io.observe(h))
  }
}

function addAnchors() {
  contentEl.querySelectorAll('h2, h3').forEach((h) => {
    if (!h.id) h.id = slugify(h.textContent)
    const a = document.createElement('a')
    a.className = 'anchor'
    a.href = `#${location.hash.replace('#','') || 'getting-started'}`
    a.textContent = '#'
    a.setAttribute('aria-label', `Link to ${h.textContent}`)
    a.addEventListener('click', (e) => {
      e.preventDefault()
      history.replaceState(null, '', `${location.pathname}${location.hash}`)
      h.scrollIntoView({ behavior: 'smooth', block: 'start' })
    })
    h.appendChild(a)
  })
}

function addCopyButtons() {
  contentEl.querySelectorAll('pre').forEach((pre) => {
    const btn = document.createElement('button')
    btn.className = 'copy'
    btn.type = 'button'
    btn.textContent = 'copy'
    btn.addEventListener('click', async () => {
      if (!navigator.clipboard) return
      try {
        await navigator.clipboard.writeText(pre.querySelector('code')?.innerText ?? pre.innerText)
        btn.textContent = 'copied'
        setTimeout(() => { btn.textContent = 'copy' }, 1400)
      } catch { /* clipboard blocked */ }
    })
    pre.appendChild(btn)
  })
}

function buildPager(slug) {
  const i = DOCS.findIndex((d) => d.slug === slug)
  const prev = DOCS[i - 1]
  const next = DOCS[i + 1]
  pagerEl.innerHTML =
    (prev ? `<a href="#${prev.slug}"><span>← previous</span><b>${prev.title}</b></a>` : '<div class="void"></div>') +
    (next ? `<a class="next" href="#${next.slug}"><span>next →</span><b>${next.title}</b></a>` : '<div class="void"></div>')
}

async function load(slug) {
  const doc = bySlug[slug] || DOCS[0]
  setActive(doc.slug)
  crumbEl.innerHTML = `docs <span>/</span> ${doc.title}`
  document.title = `${doc.title} — gitstate docs`
  contentEl.innerHTML = 'Loading…'
  try {
    const res = await fetch(doc.path, { cache: 'no-cache' })
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    contentEl.innerHTML = marked.parse(await res.text())

    // Screenshots live beside this file, whatever path the markdown used.
    contentEl.querySelectorAll('img').forEach((img) => {
      const s = img.getAttribute('src') || ''
      if (/^https?:/i.test(s)) return
      const m = s.match(/(?:\.\.\/)*(?:docs\/)?screenshots\/(.+)$/)
      if (m) img.setAttribute('src', `./screenshots/${m[1]}`)
      img.loading = 'lazy'
    })
    // Cross-doc markdown links become in-page navigation.
    contentEl.querySelectorAll('a[href]').forEach((a) => {
      const h = a.getAttribute('href') || ''
      if (/^(https?:|#|mailto:)/i.test(h)) return
      const m = h.match(/([^/]+\.md)(#.*)?$/i)
      const target = m && byFile[m[1].toLowerCase()]
      if (target) a.setAttribute('href', `#${target.slug}`)
    })
    contentEl.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener' })

    await renderMermaid()
    addAnchors()
    addCopyButtons()
    buildToc()
    buildPager(doc.slug)
    window.scrollTo({ top: 0 })
  } catch (err) {
    contentEl.innerHTML =
      `<div class="err">Could not load <code>${doc.path.split('/').pop()}</code> — ${err.message}.` +
      ` Docs are fetched at runtime, so open this page over HTTP (for example <code>npx serve site</code>)` +
      ` rather than from the filesystem.</div>`
    tocEl.innerHTML = ''
    pagerEl.innerHTML = ''
  }
}

/* Sidebar filter — plain substring match over the page titles. */
const filterEl = document.getElementById('filter')
filterEl.addEventListener('input', () => {
  const q = filterEl.value.trim().toLowerCase()
  let shown = 0
  navEl.querySelectorAll('a').forEach((a) => {
    const hit = !q || a.textContent.toLowerCase().includes(q)
    a.classList.toggle('hidden', !hit)
    if (hit) shown++
  })
  navEl.querySelectorAll('.group').forEach((g) => {
    let n = g.nextElementSibling
    let any = false
    while (n && n.tagName === 'A') { if (!n.classList.contains('hidden')) any = true; n = n.nextElementSibling }
    g.style.display = any ? '' : 'none'
  })
  emptyEl.hidden = shown > 0
})
addEventListener('keydown', (e) => {
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) {
    e.preventDefault()
    filterEl.focus()
    filterEl.select()
  }
})

const current = () => (location.hash || '').replace('#', '') || DOCS[0].slug
addEventListener('hashchange', () => load(current()))
load(current())
</script>
</body>
</html>
