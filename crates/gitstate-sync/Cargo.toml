[package]
name = "gitstate-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "gitstate's peer-to-peer replication of contexts + categories: the merge algebra, individually-signed ops, and the HTTP peer transport"

[dependencies]
# The domain lives in gitstate-core (SyncOp, SignedOp, SyncPeer, the Store and
# SyncEngine traits, Context/Category).
gitstate-core = { workspace = true }
async-trait = { workspace = true }
# The peer transport is HTTP over an operator-supplied URL. `reqwest` is already
# a workspace dependency (the forge REST path), so this adds no new package.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# A real Store to merge into, so the replay is tested against the actual CRDT
# path rather than a hand-rolled stand-in.
gitstate-store = { workspace = true }
tokio = { workspace = true }
# The shared KOTVA merge engine (substrate capability ③). A DEV dependency,
# deliberately and honestly: gitstate's merge decisions are still taken by its
# own SQL-native algebra in gitstate-store, so claiming the shared engine as a
# runtime dependency would be false. It is here as the independent reference that
# algebra is held against — tests/shared_engine_parity.rs replays the same op
# streams through both and asserts they pick the same winners, and names the one
# place the mappings are not equivalent instead of hiding it.
dmtap-sync = { workspace = true }

[lints]
workspace = true
