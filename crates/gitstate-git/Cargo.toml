[package]
name = "gitstate-git"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "gitstate git derivation engine: git2-rs history/blame/SZZ/diff → project state, effort, and six-dimension contributions"

[dependencies]
gitstate-core = { workspace = true }
git2 = { workspace = true }
regex = { workspace = true }
time = { workspace = true }

[build-dependencies]
# Compiles the iconv-name shim next to the vendored libgit2 (see build.rs).
#
# Declared unconditionally, not under [target.'cfg(target_os = "macos")'].
# build.rs decides whether to build the shim at *run* time, by reading TARGET,
# but its `cc::Build` reference has to resolve at *compile* time — so on a host
# where the cfg was false the build script itself failed to compile with
# "cannot find module or crate `cc`", which is what took CI down on Linux while
# every macOS build stayed green.
#
# Keeping it unconditional also makes cross-compilation work: build scripts are
# compiled for the host, so a Linux → macOS cross would have evaluated the cfg
# against Linux, dropped cc, and skipped the shim on exactly the target that
# needs it.
cc = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
