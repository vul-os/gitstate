name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

      # gitstate-sync must be IN the workspace, so that `cargo test --workspace`
      # above actually compiles and runs its convergence and engine-parity suites.
      # It used to be excluded — and the consequence was that its tests never ran
      # in the gate that matters. If it drifts back out, the suites vanish
      # silently, so assert membership explicitly rather than trusting the
      # manifest.
      - name: Assert the sync crate is a workspace member
        run: |
          if ! cargo metadata --no-deps --format-version 1 \
              | grep -q '"name":"gitstate-sync"'; then
            echo "::error::gitstate-sync must be a workspace member, or cargo test --workspace skips its tests"
            exit 1
          fi
          echo "ok: gitstate-sync is a workspace member"

      # The two proof suites are named individually. `cargo test --workspace`
      # passing is not evidence they ran: a renamed or deleted test file leaves the
      # workspace green with the proof gone.
      - name: Assert the convergence and engine-parity proofs ran
        run: |
          set -o pipefail
          out=$(cargo test -p gitstate-sync --test convergence \
                           --test shared_engine_parity 2>&1 | tee /dev/stderr)
          for t in every_arrival_order_of_a_mixed_context_op_set_converges \
                   two_replicas_fed_in_opposite_orders_then_exchanged_agree \
                   lww_registers_agree_with_the_shared_engine_over_every_arrival_order \
                   the_exact_tie_break_is_length_major_in_both_engines; do
            if ! printf '%s' "$out" | grep -q "test $t \.\.\. ok"; then
              echo "::error::proof '$t' did not run"
              exit 1
            fi
          done
          echo "ok: the convergence and shared-engine parity proofs ran"

  rust-offline:
    name: Rust (offline, no product dependency)
    runs-on: ubuntu-latest
    # The invariant that replaced the old workspace exclusion. gitstate must build
    # with NO network access from the committed lockfile, and must not depend on
    # another vulos product's repository — the shared merge engine comes from
    # crates.io (`kotva-sync`), never from a git dependency on `envoir`.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Populate the registry cache once, WITH network, then prove the build needs
      # none. Fetching first is what makes the offline step meaningful rather than
      # a test of whether the cache happened to be warm.
      - name: Fetch dependencies (the only networked step)
        run: cargo fetch --locked

      - name: Build with no network
        run: cargo build --workspace --locked --offline
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Assert Cargo.lock has no git sources
        run: |
          if grep -q 'source = "git' Cargo.lock; then
            echo "::error::Cargo.lock has a git source; gitstate must depend on the published substrate, not on another product's repository"
            grep -n 'source = "git' Cargo.lock
            exit 1
          fi
          echo "ok: no git sources in Cargo.lock"

      # No product may be named as a dependency source. Checked by name, not only
      # by protocol, so a `path` or `[patch]` entry pointing at a sibling checkout
      # is caught too.
      #
      # Comments are stripped first, deliberately: the manifests explain at length
      # WHY the old envoir git dependency was removed, and a check that cannot tell
      # a dependency from a comment about a dependency would make that history
      # unwritable — which is how the explanation gets deleted instead of the
      # dependency.
      - name: Assert no cross-product dependency
        run: |
          hits=$(sed 's/#.*//' Cargo.toml crates/*/Cargo.toml \
            | grep -nE '(envoir|ephor|slipscan|flowstock|beepbite|propfix|soko|basin|kerf)' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::a manifest names another vulos product; substrate is not a product"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "ok: no manifest names another product (comments excluded)"

      # Ephor is a future convenience for NAT traversal and must never be a
      # prerequisite. Assert it appears in no build file and no source file — not
      # as a dependency, not as a default endpoint, not as a fallback.
      #
      # no-broker-dep:allow-file this workflow names the broker in order to assert its
      # absence; the grep pattern below cannot do its job without spelling the name.
      - name: Assert no Ephor dependency anywhere
        run: |
          hits=$(grep -rniE '\bephor\b' --include='*.rs' --include='*.toml' \
              --include='*.lock' crates/ Cargo.toml Cargo.lock || true)
          if [ -n "$hits" ]; then
            echo "::error::Ephor must not appear in any build or code path"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "ok: no Ephor reference in any manifest, lockfile or source"

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      # `npm run lint` exiting 0 is not evidence the type-aware rules ran at
      # all — that is exactly how this repo's TS migration briefly enforced
      # nothing while reporting full coverage. This gate runs the tools
      # against a fixture with a genuine floating promise and asserts the
      # type-aware rule actually fires, checks typescript is pinned exactly
      # (a caret let typescript-eslint silently fail to load once before),
      # and asserts a real file-coverage floor.
      - name: Lint config gate (type-awareness, TS pin, coverage floor)
        run: npm run check:lint-config
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  e2e:
    name: E2E (seeded daemon, dark + light)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The daemon serves web/dist, so the SPA must be built before it starts.
      - name: Build SPA
        working-directory: web
        run: npm run build

      # Deterministic synthetic dataset — the suite asserts against real rows,
      # and its preflight fails loudly if the database is empty.
      - name: Seed the demo dataset
        run: cargo run -p gitstate-cli -- seed --demo
        env:
          GITSTATE_DATA_DIR: ${{ runner.temp }}/gitstate-data

      - name: Start the daemon
        run: |
          cargo run -p gitstate-cli -- serve --port 8080 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "daemon up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::daemon did not become healthy within 60s"; exit 1
        env:
          GITSTATE_DATA_DIR: ${{ runner.temp }}/gitstate-data

      - name: Run the e2e suite
        working-directory: web
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:8080

  # The landing page and docs are rendered in a real browser at eight viewports
  # in both colour schemes. None of what this catches is visible in a diff: a
  # stretched screenshot, a light-mode capture shown on a dark page, body copy
  # under 12px, an element pushing the page sideways, a dead anchor.
  site-render:
    name: site/ renders correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          cd scripts
          npm install --silent
          npx --yes playwright install --with-deps chromium

      # Self-test first: it breaks each invariant on purpose and demands the
      # check notice. A render gate that has stopped discriminating looks
      # exactly like one that passes.
      - name: Gate self-test
        run: node scripts/check-render.mjs --selftest

      - name: Render checks
        run: node scripts/check-render.mjs
